<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NYSDS Visual Changes</title>
    <!-- Relative paths only: this page is deployed as a static site. -->
    <link rel="stylesheet" href="assets/nysds-full.min.css" />
    <script src="assets/nysds.js"></script>
    <script src="results.js"></script>
    <style>
      /* Only what @nysds/styles utility classes cannot express. Layout,
         spacing and type come from utility classes in the markup; the
         stylesheet's reset handles box-sizing and heading/body margins. */
      body {
        background: var(--nys-color-neutral-10);
        color: var(--nys-color-text);
      }
      header {
        position: sticky;
        top: 0;
        background: var(--nys-color-surface);
        border-bottom: var(--nys-border-width-sm) solid
          var(--nys-color-neutral-100);
      }
      h1 {
        font-weight: var(--nys-font-weight-semibold);
      }
      .back {
        color: var(--nys-color-link);
      }
      .meta {
        color: var(--nys-color-text-weak);
        flex-basis: 100%;
      }
      nys-textinput {
        min-width: 240px;
      }
      main {
        /* Wider than the widescreen container's 80rem: three screenshots side by side. */
        --nys-grid-container-max-width: 100rem;
      }
      .item {
        background: var(--nys-color-surface);
        border: var(--nys-border-width-sm) solid var(--nys-color-neutral-100);
        border-radius: var(--nys-radius-lg);
        overflow: hidden;
      }
      .item > summary {
        list-style: none;
        cursor: pointer;
      }
      .item > summary::-webkit-details-marker {
        display: none;
      }
      .item > summary:focus-visible {
        outline: var(--nys-border-width-md) solid var(--nys-color-focus);
        outline-offset: calc(var(--nys-border-width-md) * -1);
      }
      .name {
        font-weight: var(--nys-font-weight-semibold);
      }
      .impact {
        width: 10rem;
      }
      .impact .bar {
        height: var(--nys-size-100);
        background: var(--nys-color-neutral-50);
        border-radius: var(--nys-radius-round);
        overflow: hidden;
      }
      .impact .bar i {
        display: block;
        height: 100%;
        background: var(--nys-color-warning);
      }
      .impact span {
        color: var(--nys-color-text-weak);
      }
      .body {
        border-top: var(--nys-border-width-sm) solid
          var(--nys-color-neutral-100);
      }
      .controls input[type="range"] {
        accent-color: var(--nys-color-link);
      }
      .pane h4 {
        color: var(--nys-color-text-weak);
        font-weight: var(--nys-font-weight-semibold);
      }
      .pane .frame {
        border: var(--nys-border-width-sm) solid var(--nys-color-neutral-100);
        background: repeating-conic-gradient(
            var(--nys-color-black-transparent-100) 0 25%,
            transparent 0 50%
          )
          0 0 / var(--nys-size-200) var(--nys-size-200);
        overflow: auto;
        max-height: 70vh;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .overlay {
        position: relative;
        display: inline-block;
        max-width: 100%;
      }
      .overlay img:last-child {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .empty {
        text-align: center;
        color: var(--nys-color-text-weak);
      }
    </style>
  </head>
  <body class="nys-font-ui-md">
    <header
      class="nys-z-100 nys-display-flex nys-flex-wrap nys-flex-align-center nys-flex-row-gap-150 nys-flex-column-gap-300 nys-padding-y-150 nys-padding-x-300"
    >
      <!-- The PR preview publishes this report at /visual/; "../" is its landing page. -->
      <a class="back nys-font-ui-sm" href="../">← Component preview</a>
      <h1 class="nys-font-ui-lg nys-margin-1px">NYSDS Visual Changes</h1>
      <nys-textinput
        type="search"
        id="q"
        ariaLabel="Filter stories"
        placeholder="Filter stories…"
        width="lg"
      ></nys-textinput>
      <nys-toggle id="vp" label="Mobile" size="sm" noIcon></nys-toggle>
      <span class="meta nys-font-ui-sm" id="meta"></span>
    </header>
    <main class="nys-grid-container-widescreen nys-padding-y-300">
      <div class="nys-grid-row">
        <div class="nys-grid-col-12">
          <nys-tabgroup id="tabs" name="Result status">
            <nys-tab id="tab-attention" label="All changes" selected></nys-tab>
            <nys-tab id="tab-changed" label="Changed"></nys-tab>
            <nys-tab id="tab-new" label="New"></nys-tab>
            <nys-tab id="tab-removed" label="Removed"></nys-tab>
            <nys-tabpanel
              id="panel-attention"
              aria-labelledby="tab-attention"
            ></nys-tabpanel>
            <nys-tabpanel
              id="panel-changed"
              aria-labelledby="tab-changed"
            ></nys-tabpanel>
            <nys-tabpanel
              id="panel-new"
              aria-labelledby="tab-new"
            ></nys-tabpanel>
            <nys-tabpanel
              id="panel-removed"
              aria-labelledby="tab-removed"
            ></nys-tabpanel>
          </nys-tabgroup>
        </div>
      </div>
    </main>
    <script>
      const $ = (s) => document.querySelector(s);
      let data,
        status = "attention",
        vp = "desktop",
        query = "";
      // Results only contain changes; unchanged stories are counted, not listed.
      const BADGE_INTENT = {
        changed: "warning",
        new: "success",
        removed: "info",
        error: "danger",
      };

      function load() {
        data = window.VR_DATA;
        if (!data) {
          $("main").innerHTML =
            `<div class="empty nys-padding-y-800">No results. Run npm run vr:test first.</div>`;
          return;
        }
        render();
      }

      const matches = (r) =>
        r.viewport === vp &&
        (status === "attention" || r.status === status) &&
        (r.title + " " + r.name + " " + r.id).toLowerCase().includes(query);

      function render() {
        const counts = {};
        data.results
          .filter((r) => r.viewport === vp)
          .forEach((r) => (counts[r.status] = (counts[r.status] || 0) + 1));
        const attn = Object.values(counts).reduce((n, c) => n + c, 0);
        const labels = {
          attention: `All changes (${attn})`,
          changed: `Changed (${counts.changed || 0})`,
          new: `New (${counts.new || 0})`,
          removed: `Removed (${counts.removed || 0})`,
        };
        for (const [k, l] of Object.entries(labels)) $(`#tab-${k}`).label = l;
        document
          .querySelectorAll("nys-tabpanel")
          .forEach((p) => (p.innerHTML = ""));
        const list = $(`#panel-${status}`);
        $("#meta").textContent =
          `${new Date(data.generated).toLocaleString()} · ${vp} ${data.viewports[vp].join("×")}` +
          (data.base
            ? ` · Baseline: ${data.base.ref} @ ${data.base.sha.slice(0, 7)}`
            : "") +
          ` · ${data.unchanged?.[vp] ?? 0} unchanged (not shown)` +
          (data.minChange ? ` · ≥${data.minChange}% = changed` : "") +
          (data.uncovered?.length
            ? ` · No interactive-state coverage: ${data.uncovered.join(", ")}`
            : "");

        const weight = (r) => r.diffPercent ?? 0.0001;
        const rows = data.results
          .filter(matches)
          .sort((a, b) => weight(b) - weight(a) || a.id.localeCompare(b.id));
        if (!rows.length) {
          list.innerHTML = `<div class="empty nys-padding-y-800">No visual changes.</div>`;
          return;
        }
        const maxPct = Math.max(...rows.map((r) => r.diffPercent || 0), 0.01);
        list.innerHTML = rows.map((r) => item(r, maxPct)).join("");
      }

      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      // "Components/Accordion" + "Bordered" → "Accordion - Bordered". Removed
      // stories and capture errors only have an id.
      const label = (r) =>
        r.name ? `${r.title.split("/").pop()} - ${r.name}` : r.id;

      function item(r, maxPct) {
        const pct = r.diffPercent;
        const impact =
          r.status === "changed"
            ? `<div class="impact"><div class="bar"><i style="width:${Math.max(4, (pct / maxPct) * 100)}%"></i></div>
       <span class="nys-font-ui-sm">${pct < 0.01 ? "<0.01" : pct.toFixed(2)}% · ${r.diffPixels.toLocaleString()} px</span></div>`
            : `<div class="impact"></div>`;
        return `<details class="item nys-margin-b-150" data-id="${r.key}"><summary class="nys-display-flex nys-flex-align-center nys-flex-gap-150 nys-padding-y-100 nys-padding-x-200">
    <nys-badge size="sm" intent="${BADGE_INTENT[r.status]}" label="${r.status}"></nys-badge>
    <span class="name nys-flex-1">${esc(label(r))}</span>${impact}</summary>
    <div class="body nys-padding-200" data-body></div></details>`;
      }

      function body(r, mode) {
        const b = `baselines/${r.key}.png`,
          c = `current/${r.key}.png`,
          d = `diff/${r.key}.png`;
        const t = `?${Date.parse(data.generated)}`;
        const info =
          r.status === "changed"
            ? `<span class="meta nys-font-ui-sm">${r.sizeChanged ? `Size changed ${r.baselineSize.join("×")} → ${r.currentSize.join("×")} · ` : ""}${r.bbox ? `changed region ${r.bbox.w}×${r.bbox.h} at (${r.bbox.x}, ${r.bbox.y})` : ""}</span>`
            : "";
        const controls = `controls nys-display-flex nys-flex-wrap nys-flex-align-center nys-flex-gap-100 nys-margin-b-150`;
        const ctl = `<div class="${controls}">
    ${r.status === "changed" ? ["side", "overlay"].map((m) => `<nys-button size="sm" data-mode="${m}" variant="${m === mode ? "filled" : "outline"}" label="${m === "side" ? "Side by side" : "Overlay"}"></nys-button>`).join("") : ""}
    ${info}</div>`;
        // Panes stack below the desktop breakpoint and sit three across above it.
        const pane = (title, src, cols = "nys-desktop:nys-grid-col-4") =>
          `<div class="pane nys-grid-col-12 ${cols}"><h4 class="nys-font-ui-sm nys-margin-b-100">${title}</h4><div class="frame"><img src="${src}${t}" loading="lazy" alt="${title}"></div></div>`;
        const panes = (html) =>
          `<div class="nys-grid-row nys-grid-gap-150">${html}</div>`;
        const one = (title, src) => panes(pane(title, src, ""));
        let main;
        if (r.status === "error")
          main = `<p>Capture failed: <code>${esc(r.error)}</code></p>`;
        else if (r.status === "new") main = one("New story (no baseline)", c);
        else if (r.status === "removed")
          main = one("Baseline (story no longer exists)", b);
        else if (mode === "overlay")
          main = `<div class="${controls}"><label>Baseline <input type="range" min="0" max="100" value="50" data-fade> Current</label></div>
    <div class="overlay"><img src="${b}${t}" alt="Baseline"><img src="${c}${t}" alt="Current" class="nys-opacity-50" data-top></div>`;
        else
          main = panes(
            pane("Baseline", b) + pane("Current", c) + pane("Diff", d),
          );
        return ctl + main;
      }

      document.addEventListener("click", (e) => {
        const t = e.target.closest("nys-button");
        if (!t) return;
        if (t.dataset.mode) {
          const it = t.closest(".item");
          it.querySelector("[data-body]").innerHTML = body(
            data.results.find((x) => x.key === it.dataset.id),
            t.dataset.mode,
          );
        }
      });
      document.addEventListener(
        "toggle",
        (e) => {
          const it = e.target;
          if (!it.matches?.(".item") || !it.open) return;
          const slot = it.querySelector("[data-body]");
          if (!slot.innerHTML)
            slot.innerHTML = body(
              data.results.find((x) => x.key === it.dataset.id),
              "side",
            );
        },
        true,
      );
      document.addEventListener("nys-tab-select", (e) => {
        status = e.detail.id.replace("tab-", "");
        render();
      });
      document.addEventListener("nys-change", (e) => {
        if (e.target.id !== "vp") return;
        vp = e.detail.checked ? "mobile" : "desktop";
        render();
      });
      document.addEventListener("nys-input", (e) => {
        if (e.target.id === "q") {
          query = (e.detail?.value ?? "").toLowerCase();
          render();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.matches("[data-fade]"))
          e.target.closest(".body").querySelector("[data-top]").style.opacity =
            e.target.value / 100;
      });
      load();
    </script>
  </body>
</html>
