# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Test Build with Node.js

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - 'develop'
      - 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.17.0']

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: npm i # default is `npm ci` but that causes issues ALL THE TIME, so we're reverting back to `npm i` this should NOT be changed back to npm ci.
    # Playwright browsers are cached per Playwright version, so they're only
    # downloaded when Playwright is upgraded. Their system libraries are
    # installed with apt, which can't be cached, so install-deps runs on a hit.
    #
    # Call the root `playwright` package directly. The example apps also
    # install `@playwright/test`, which ships a `playwright` bin of its own.
    # When the two resolve to different versions, `npx playwright install`
    # can download browser builds for the wrong one and every Web Test
    # Runner session then fails at launch.
    - name: Get Playwright version
      id: playwright
      run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-all
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: node node_modules/playwright/cli.js install --with-deps
      env:
        DEBIAN_FRONTEND: noninteractive
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: node node_modules/playwright/cli.js install-deps
      env:
        DEBIAN_FRONTEND: noninteractive
    - name: Build Packages
      run: npm run build:all
    - name: Test codegen
      # Node-only suites (node:test). They are excluded from the Web Test
      # Runner glob because that runner executes files in Playwright browsers.
      run: npm test -w @nysds/codegen
    - name: Test Components
      run: npm run test:ai
      # continue-on-error: true
    - name: Build Storybook
      run: npm run storybook:cibuild
