# NYSDS Review App
#
# Builds the full NYSDS review app. This app hosts a homepage with three apps:
#
# The Accessibility testing builds one static page per story for the components
# a PR into develop changes (plus every component that uses them) and deploys
# them to the preview Netlify site under the alias pr-<number>. Testers using
# assistive technology get a link in a PR comment. 
#
# Visual regression report at /visual/: every story
# is screenshotted on the base branch (the baselines) and on the PR branch, and
# the differences are listed. Baselines are rendered fresh each run, never stored.
#
# Code review at /code-review/: the framework wrappers
# that are generated are not tracked in git. We still need to check the generated
# code, so this review app tracks all generated changes and displays rich diffs
# and the pathway a file takes to generation.
#
# Requires repo secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID. PRs from forks
# don't receive secrets, so they are skipped.

name: NYSDS Review App

on:
  pull_request:
    branches:
      - 'develop'
    types: [opened, synchronize, reopened, closed]

# One run per PR; closing a PR cancels a deploy still in progress so it can't
# publish after cleanup.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the build diffs against the base branch

      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'

      - name: Install dependencies
        run: npm i # default is `npm ci` but that causes issues ALL THE TIME, so we're reverting back to `npm i` this should NOT be changed back to npm ci.

      - name: Install Chromium
        # Renders each story to static markup. See test-node-js.yaml for why
        # the root playwright package is called directly.
        run: node node_modules/playwright/cli.js install --with-deps chromium
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build packages
        run: npm run build:packages

      - name: Regenerate stories from JSDoc
        run: npm run gen:stories

      - name: Build component bundle
        # dist/nysds.js (the UMD bundle) powers the visual regression report's
        # search, viewport toggle and tabs.
        run: npm run build:umd

      - name: Visual regression
        # Renders every story as a static page (the same pages the preview
        # publishes) for the base branch, in a separate worktree, and for this
        # branch, then compares them and writes .visual/report. Packages are
        # already built above, so no --build. Capture errors exit 1 but are
        # listed in the report, so they don't block the deploy.
        continue-on-error: true
        run: node src/scripts/nysds-review/visual.mjs test
        env:
          VR_BASE: origin/${{ github.base_ref }}

      - name: Code review
        # Regenerates the gitignored framework wrappers for the base branch and
        # this PR and compares them, writing .code-review/index.html for the
        # deploy's /code-review/ page. Failures don't block the deploy; the
        # landing page then marks the code review as not generated.
        continue-on-error: true
        run: >-
          npm run review:codegen --
          --base origin/${{ github.base_ref }}
          --head HEAD
          --html-file .code-review/index.html

      - name: Build preview pages
        id: preview
        run: node src/scripts/nysds-review/build-preview.mjs
        env:
          PREVIEW_BASE: origin/${{ github.base_ref }}
          # Shown on the landing page. Passed through env, never interpolated
          # into the script, because the PR title is user-controlled text.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Deploy to Netlify
        id: deploy
        # Always deployed: the landing page links the visual regression report
        # and code review even when no component has story pages.
        # The CLI treats the repo's npm workspaces as a monorepo and refuses to
        # deploy without a project filter, so deploy a copy from outside it.
        run: |
          site_dir="$RUNNER_TEMP/a11y-preview"
          cp -R .preview/dist "$site_dir"
          (cd "$RUNNER_TEMP" && npx --yes netlify-cli@27.13.0 deploy \
            --no-build \
            --dir="$site_dir" \
            --alias="pr-${PR_NUMBER}" \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="PR #${PR_NUMBER} @ ${HEAD_SHA}" \
            --json) > .preview/deploy.json
          echo "url=$(node -p 'require("./.preview/deploy.json").deploy_url')" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { deployedBody, upsertComment } = require("./src/scripts/nysds-review/preview-comment.cjs");
            const body = deployedBody({
              manifestPath: ".preview/manifest.json",
              previewUrl: process.env.PREVIEW_URL,
              sha: context.payload.pull_request.head.sha,
            });
            await upsertComment({ github, context, body });
