# Accessibility preview sweep
#
# Safety net for preview.yaml: deletes the Netlify preview deploys of any PR
# that is merged or closed, in case its cleanup job didn't run or failed.

name: Accessibility Preview Sweep

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'

      - name: Delete deploys of closed PRs
        run: node src/scripts/cleanup-preview.mjs --sweep
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
